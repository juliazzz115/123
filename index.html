<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Трекер статусов клиентов</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Трекер статусов клиентов</h1>

        <!-- Переключатель режимов -->
        <div class="mode-selector">
            <label>
                <input type="radio" name="mode" value="mode-a" checked>
                Режим А (Подал сам → Пометить → Проверить)
            </label>
            <label>
                <input type="radio" name="mode" value="mode-b">
                Режим Б (Оплатил → Подано → Помечено → Проверено)
            </label>
        </div>

        <!-- Секция добавления клиента -->
        <div class="client-input">
            <div class="input-group">
                <select id="clientSelect" class="client-select">
                    <option value="">-- Выберите клиента --</option>
                </select>
                <button id="addClientBtn" class="btn btn-primary">Добавить в таблицу</button>
            </div>
            <div class="input-group">
                <input type="text" id="newClientName" placeholder="Имя нового клиента">
                <button id="addNewClientBtn" class="btn btn-secondary">Создать клиента</button>
            </div>
        </div>

        <!-- Таблица -->
        <div class="table-container">
            <table id="clientTable">
                <thead>
                    <tr id="tableHeader">
                        <th>Имя клиента</th>
                        <th>Подал сам</th>
                        <th>Пометить</th>
                        <th>Проверить</th>
                        <th>Действия</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                </tbody>
            </table>
        </div>

        <!-- Секция формы документа -->
        <div class="document-section">
            <h2>Форма документа</h2>

            <div class="document-form">
                <!-- Статичные поля -->
                <div class="form-group">
                    <label for="staticField1">Название документа:</label>
                    <input type="text" id="staticField1" placeholder="Введите название документа">
                </div>

                <div class="form-group">
                    <label for="staticField2">Дата создания:</label>
                    <input type="date" id="staticField2">
                </div>

                <div class="form-group">
                    <label for="staticField3">Описание:</label>
                    <textarea id="staticField3" placeholder="Введите описание документа" rows="3"></textarea>
                </div>

                <!-- Загрузка CSV файла -->
                <div class="form-group">
                    <label for="csvFile">Загрузить CSV файл:</label>
                    <input type="file" id="csvFile" accept=".csv">
                    <small>Загрузите CSV файл для заполнения выпадающего списка</small>
                </div>

                <!-- Выпадающий список из CSV -->
                <div class="form-group">
                    <label for="csvDataSelect">Выберите данные из CSV:</label>
                    <select id="csvDataSelect" disabled>
                        <option value="">-- Сначала загрузите CSV файл --</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="selectedValue">Выбранное значение:</label>
                    <input type="text" id="selectedValue" readonly placeholder="Здесь появится выбранное значение">
                </div>

                <!-- Кнопка скачивания -->
                <div class="form-actions">
                    <button id="downloadDocBtn" class="btn btn-success">Скачать документ</button>
                    <button id="clearFormBtn" class="btn btn-secondary">Очистить форму</button>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
